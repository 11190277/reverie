<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live2D 测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh;
    background:linear-gradient(180deg,#fdf6f8,#eef2f7);
    display:flex; flex-direction:column;
    font-family:-apple-system,"PingFang SC",sans-serif;
    overflow:hidden;
  }
  #stage { width:100%; flex:1; display:block; }
  #status {
    position:fixed; top:10px; left:10px; right:10px;
    font-size:12px; color:#555; line-height:1.6;
    background:rgba(255,255,255,.9);
    padding:8px 10px; border-radius:10px;
    white-space:pre-wrap; z-index:10;
  }
  #bar { padding:12px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  button {
    border:none; background:#fff; color:#555;
    padding:8px 14px; border-radius:14px; font-size:13px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
</style>
</head>
<body>

<div id="status">检查中…</div>
<canvas id="stage"></canvas>
<div id="bar">
  <button onclick="zoom(1.15)">放大</button>
  <button onclick="zoom(0.87)">缩小</button>
  <button onclick="showInfo()">模型信息</button>
</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
const statusEl = document.getElementById('status');
let model = null, app = null, userScale = 1;

const MODEL_URL = encodeURI('live2d/白毛宝宝.model3.json');

window.addEventListener('load', async () => {
  const canvas = document.getElementById('stage');
  app = new PIXI.Application({
    view: canvas, autoStart: true, resizeTo: canvas,
    backgroundAlpha: 0, antialias: true
  });

  statusEl.textContent = '正在加载模型…\n（贴图有点大，等一下）';

  try {
    const r = await fetch(MODEL_URL);
    if (!r.ok) throw new Error('model3.json 读不到，HTTP ' + r.status);

    model = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
    app.stage.addChild(model);
    model.anchor.set(0.5, 0.5);
    layout();
    window.addEventListener('resize', () => setTimeout(layout, 100));

    // 点/拖动时让他看向手指
    canvas.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      model.focus(e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      model.focus(e.clientX - rect.left, e.clientY - rect.top);
      statusEl.textContent = '你摸了他一下';
    });

    statusEl.textContent = '加载成功 ✓\n手指划一划，他的眼睛会跟着走';

  } catch (e) {
    statusEl.textContent = '失败：\n' + (e && e.message ? e.message : e);
    console.error(e);
  }
});

function layout(){
  if(!model || !app) return;
  const w = app.renderer.width, h = app.renderer.height;
  const base = Math.min(w / model.internalModel.originalWidth, h / model.internalModel.originalHeight);
  model.scale.set(base * 0.9 * userScale);
  model.x = w / 2;
  model.y = h / 2;
}

function zoom(f){
  userScale *= f;
  layout();
  statusEl.textContent = '缩放：' + userScale.toFixed(2);
}

function showInfo(){
  if(!model){ statusEl.textContent='模型还没加载'; return; }
  const im = model.internalModel;
  const mm = im.motionManager;
  const groups = Object.keys(mm.definitions || {});
  const em = mm.expressionManager;
  statusEl.textContent =
    '尺寸：' + im.originalWidth + ' x ' + im.originalHeight + '\n' +
    '动作组：' + (groups.length ? groups.join(', ') : '无') + '\n' +
    '表情数：' + (em && em.definitions ? em.definitions.length : 0) + '\n' +
    '参数数：' + im.coreModel.getParameterCount();
}
</script>
</body>
</html>
