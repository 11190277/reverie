<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live2D 测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh;
    background:linear-gradient(180deg,#fdf6f8,#eef2f7);
    display:flex; flex-direction:column;
    font-family:-apple-system,"PingFang SC",sans-serif;
    overflow:hidden;
  }
  #stage { width:100%; flex:1; display:block; }
  #status {
    position:fixed; top:10px; left:10px; right:10px;
    font-size:12px; color:#555; line-height:1.6;
    background:rgba(255,255,255,.9);
    padding:8px 10px; border-radius:10px;
    white-space:pre-wrap;
  }
  #bar { padding:12px; display:flex; gap:8px; justify-content:center; }
  button {
    border:none; background:#fff; color:#555;
    padding:8px 14px; border-radius:14px; font-size:13px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
</style>
</head>
<body>

<div id="status">检查中…</div>
<canvas id="stage"></canvas>
<div id="bar">
  <button onclick="playMotion()">随机动作</button>
  <button onclick="playExpr()">随机表情</button>
</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
const statusEl = document.getElementById('status');
let model = null, app = null;

const CANDIDATES = [
  'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@v0.4.0/test/assets/hiyori/hiyori_pro_t11.model3.json',
  'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@main/test/assets/hiyori/hiyori_pro_t11.model3.json',
  'https://raw.githubusercontent.com/guansss/pixi-live2d-display/master/test/assets/hiyori/hiyori_pro_t11.model3.json',
  'https://cdn.jsdelivr.net/gh/Eikanya/Live2d-model@master/%E5%B0%91%E5%A5%B3%E5%89%8D%E7%BA%BF/1/model.json'
];

function diag(){
  const gl = document.createElement('canvas').getContext('webgl');
  return [
    'Cubism Core: ' + (typeof Live2DCubismCore !== 'undefined' ? 'OK' : '✗'),
    'PIXI: ' + (typeof PIXI !== 'undefined' ? 'OK v' + (PIXI.VERSION||'?') : '✗'),
    'PIXI.live2d: ' + (typeof PIXI !== 'undefined' && PIXI.live2d ? 'OK' : '✗'),
    'WebGL: ' + (gl ? 'OK' : '✗')
  ].join('\n');
}

window.addEventListener('load', async () => {
  const report = diag();
  statusEl.textContent = report;

  const canvas = document.getElementById('stage');
  app = new PIXI.Application({
    view: canvas, autoStart: true, resizeTo: canvas,
    backgroundAlpha: 0, antialias: true
  });

  const errors = [];
  for (let i = 0; i < CANDIDATES.length; i++) {
    const url = CANDIDATES[i];
    statusEl.textContent = report + '\n\n尝试源 ' + (i+1) + '/' + CANDIDATES.length + '…';
    try {
      const r = await fetch(url, { method:'GET' });
      if (!r.ok) throw new Error('HTTP ' + r.status);

      model = await PIXI.live2d.Live2DModel.from(url);
      app.stage.addChild(model);
      model.anchor.set(0.5, 0.5);
      layout();
      window.addEventListener('resize', () => setTimeout(layout, 100));
      model.on('pointerdown', () => {
        statusEl.textContent = '你摸了他一下';
        playMotion();
      });
      statusEl.textContent = '加载成功 ✓（源 ' + (i+1) + '）\n试试点他';
      return;
    } catch (e) {
      errors.push((i+1) + ': ' + (e && e.message ? e.message : e));
    }
  }

  statusEl.textContent = report + '\n\n全部源都失败：\n' + errors.join('\n');
});

function layout(){
  if(!model || !app) return;
  const w = app.renderer.width, h = app.renderer.height;
  model.scale.set(Math.min(w / model.width, h / model.height) * 0.9);
  model.x = w / 2;
  model.y = h / 2;
}

function playMotion(){
  if(!model) return;
  const defs = model.internalModel.motionManager.definitions || {};
  const groups = Object.keys(defs);
  if(!groups.length){ statusEl.textContent='没有动作组'; return; }
  const g = groups[Math.floor(Math.random()*groups.length)];
  model.motion(g);
  statusEl.textContent = '动作：' + g;
}

function playExpr(){
  if(!model) return;
  const em = model.internalModel.motionManager.expressionManager;
  if(!em || !em.definitions.length){ statusEl.textContent='没有表情'; return; }
  const i = Math.floor(Math.random()*em.definitions.length);
  em.setExpression(i);
  statusEl.textContent = '表情：' + (em.definitions[i].Name || i);
}
</script>
</body>
</html>
