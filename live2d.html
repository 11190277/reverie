<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eli</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100vh;background:linear-gradient(180deg,#fdf6f8,#eef2f7);display:flex;flex-direction:column;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden}
#stage{width:100%;flex:1;display:block;touch-action:none}
#status{position:fixed;top:10px;left:10px;right:10px;font-size:12px;color:#666;line-height:1.5;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);padding:8px 12px;border-radius:12px;white-space:pre-wrap;z-index:10}
#panel{max-height:40vh;overflow-y:auto;padding:10px 12px 20px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.05)}
.sec{margin-bottom:10px}.label{font-size:11px;color:#aaa;margin-bottom:5px}
.btns{display:flex;gap:5px;flex-wrap:wrap}
button{border:none;background:#fff;color:#555;padding:6px 11px;border-radius:11px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
button:active{background:#f5e6ec}
</style>
</head>
<body>
<div id="status">加载中…</div>
<canvas id="stage"></canvas>
<div id="panel">
  <div class="sec"><div class="label">表情</div><div class="btns" id="exprBtns"></div></div>
  <div class="sec"><div class="label">控制</div><div class="btns">
    <button onclick="clearExpr()">清空表情</button>
    <button onclick="zoom(1.15)">放大</button>
    <button onclick="zoom(0.87)">缩小</button>
    <button onclick="move(0,-20)">↑</button>
    <button onclick="move(0,20)">↓</button>
  </div></div>
</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
const S = document.getElementById('status');
let app,model,uScale=0.35,oX=0,oY=200;


const MODEL_URL = 'eli/m.model3.json';

window.addEventListener('load', async()=>{
  const c = document.getElementById('stage');
  app = new PIXI.Application({view:c,autoStart:true,resizeTo:c,backgroundAlpha:0,antialias:true,resolution:window.devicePixelRatio||1,autoDensity:true});

  S.textContent='正在加载模型…（15MB，要等一会儿）';
  try{
    model = await PIXI.live2d.Live2DModel.from(MODEL_URL,{autoInteract:false});
    app.stage.addChild(model);
    model.anchor.set(0.5,0.5);
    layout();
    window.addEventListener('resize',()=>setTimeout(layout,150));
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();model.focus(e.clientX-r.left,e.clientY-r.top)});
    c.addEventListener('pointerdown',()=>{S.textContent='你摸了我一下'});
    buildBtns();
    S.textContent='加载成功 ✓';
  }catch(e){
    S.textContent='失败：\n'+(e&&e.message?e.message:e);
    console.error(e);
  }
});

function buildBtns(){
  const box=document.getElementById('exprBtns');
  const em=model.internalModel.motionManager.expressionManager;
  if(!em||!em.definitions.length){S.textContent='表情未加载';return}
  em.definitions.forEach((d,i)=>{
    const b=document.createElement('button');
    b.textContent=d.Name||('表情'+i);
    b.onclick=()=>{em.setExpression(i);S.textContent='表情：'+(d.Name||i)};
    box.appendChild(b);
  });
}

function clearExpr(){if(!model)return;const e=model.internalModel.motionManager.expressionManager;if(e)e.resetExpression();S.textContent='已清空'}
function layout(){if(!model||!app)return;const w=app.screen.width,h=app.screen.height,im=model.internalModel;model.scale.set(Math.min(w/im.originalWidth,h/im.originalHeight)*0.95*uScale);model.x=w/2+oX;model.y=h/2+oY}
function zoom(f){uScale*=f;layout()}
function move(dx,dy){oX+=dx;oY+=dy;layout()}
</script>
</body>
</html>
