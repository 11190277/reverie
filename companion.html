<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eli</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100dvh;overflow:hidden;font-family:'Noto Serif SC',serif;font-weight:300;font-size:14px;color:#1d1d1f;background:#faf8fb}
.wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
#modelArea{position:relative;width:100%;height:38vh;flex-shrink:0;overflow:hidden;border-radius:0 0 22px 22px;box-shadow:0 3px 18px rgba(0,0,0,0.05)}
#modelBg{position:absolute;inset:0;background:linear-gradient(160deg,#fdf4f9 0%,#f6eff9 45%,#eee9f6 100%);background-size:cover;background-position:center}
#stage{position:absolute;inset:0;z-index:2;touch-action:none}
.float-card{position:absolute;z-index:5;background:rgba(255,255,255,0.55);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border-radius:16px;border:0.5px solid rgba(255,255,255,0.8);box-shadow:0 4px 16px rgba(180,150,190,0.08),inset 0 1px 0 rgba(255,255,255,0.9);padding:10px 14px;color:#4a4550;font-size:12px}
#clockCard{top:14px;left:14px;padding-top:max(12px,env(safe-area-inset-top))}
#clockCard .clock-time{font-size:27px;font-weight:200;letter-spacing:2px;color:#3a3540;line-height:1}
#clockCard .clock-date{font-size:10.5px;color:#9a94a2;margin-top:4px;letter-spacing:0.5px}
#moodCard{bottom:14px;left:14px;display:flex;align-items:center;gap:6px;font-size:11.5px}
#moodCard .mood-dot{width:6px;height:6px;border-radius:50%;background:#f0a8c0;flex-shrink:0;animation:pulse 2.4s ease infinite;box-shadow:0 0 6px rgba(240,168,192,0.6)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(0.85)}}
#sigCard{top:14px;right:14px;max-width:130px;padding-top:max(12px,env(safe-area-inset-top));font-style:italic;color:#a09aa8;font-size:10.5px;line-height:1.5;text-align:right}
.deco-dot{position:absolute;z-index:4;border-radius:50%;background:rgba(255,255,255,0.5);pointer-events:none}
.deco-dot.d1{width:5px;height:5px;top:30%;left:8%;animation:floatUp 6s ease-in-out infinite}
.deco-dot.d2{width:3px;height:3px;top:55%;left:14%;animation:floatUp 8s ease-in-out infinite 1s}
.deco-dot.d3{width:4px;height:4px;top:40%;right:10%;animation:floatUp 7s ease-in-out infinite 2s}
@keyframes floatUp{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-12px);opacity:0.8}}
#touchBubble{position:absolute;z-index:8;top:22%;left:14px;transform:translateY(6px);background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0.5px solid rgba(255,255,255,0.9);border-radius:16px;padding:9px 16px;color:#4a4550;font-size:13px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;box-shadow:0 4px 16px rgba(180,150,190,0.12);max-width:120px;line-height:1.5}
#touchBubble.show{opacity:1;transform:translateY(0)}
#panelTrigger{position:absolute;top:50%;right:0;transform:translateY(-50%);z-index:6;width:22px;height:52px;background:rgba(255,255,255,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:0.5px solid rgba(255,255,255,0.8);border-right:none;border-radius:12px 0 0 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:-2px 0 10px rgba(180,150,190,0.08)}
#panelTrigger:active{background:rgba(255,255,255,0.8)}
#panelTrigger svg{width:12px;height:12px;stroke:#8a8492;fill:none;stroke-width:1.8}
.corner-btns{position:absolute;bottom:14px;right:14px;z-index:6;display:flex;gap:7px}
.cbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:0.5px solid rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;box-shadow:0 2px 10px rgba(180,150,190,0.1)}
.cbtn:active{transform:scale(0.9);background:rgba(255,255,255,0.85)}
.cbtn svg{width:16px;height:16px;stroke:#6a6472;fill:none;stroke-width:1.5}
#sidePanel{position:absolute;top:0;right:0;bottom:0;width:180px;z-index:12;background:rgba(255,255,255,0.82);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-left:0.5px solid rgba(255,255,255,0.9);transform:translateX(100%);transition:transform .3s cubic-bezier(0.32,0.72,0,1);overflow-y:auto;padding:12px 12px 20px;padding-top:max(12px,env(safe-area-inset-top));box-shadow:-4px 0 20px rgba(180,150,190,0.1)}
#sidePanel.on{transform:translateX(0)}
.sp-close{position:sticky;top:0;display:flex;justify-content:flex-end;margin-bottom:8px}
.sp-close button{width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,0.04);color:#8a8492;font-size:16px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.sp-sec{margin-bottom:10px}
.sp-label{font-size:10.5px;color:#a09aa8;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:4px;letter-spacing:0.5px}
.sp-label svg{width:9px;height:9px;stroke:#a09aa8;fill:none;stroke-width:2.2;transition:transform .2s}
.sp-label.open svg{transform:rotate(90deg)}
.sp-btns{display:none;flex-wrap:wrap;gap:4px}
.sp-btns.show{display:flex}
.sp-btns button{padding:5px 10px;border-radius:11px;border:0.5px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.6);backdrop-filter:blur(8px);font-size:11px;color:#5a5560;font-family:inherit;transition:all .15s;box-shadow:0 1px 4px rgba(180,150,190,0.06)}
.sp-btns button:active{background:rgba(252,225,238,0.75);transform:scale(0.94)}
.sp-act{width:100%;padding:8px;border-radius:11px;border:0.5px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.6);font-size:11.5px;color:#5a5560;font-family:inherit;margin-top:4px;cursor:pointer}
.sp-act:active{background:rgba(252,225,238,0.6)}
#chatArea{flex:1;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,0.35)}
#chatScroll{flex:1;overflow-y:auto;padding:16px 14px 6px;-webkit-overflow-scrolling:touch}
#chatScroll::-webkit-scrollbar{width:0}
.cmsg{margin-bottom:11px;animation:fadeUp .28s ease}
.cmsg.ai{display:flex;justify-content:flex-start}
.cmsg.user{display:flex;justify-content:flex-end}
.ctxt{padding:10px 15px;max-width:80%;font-size:13.5px;line-height:1.7;word-break:break-word;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cmsg.ai .ctxt{background:rgba(255,255,255,0.75);border:0.5px solid rgba(255,255,255,0.9);border-radius:17px 17px 17px 5px;color:#3a3540;box-shadow:0 2px 10px rgba(180,150,190,0.06),inset 0 1px 0 rgba(255,255,255,0.8)}
.cmsg.user .ctxt{background:rgba(252,225,238,0.62);border:0.5px solid rgba(255,255,255,0.7);border-radius:17px 17px 5px 17px;color:#3a3540;box-shadow:0 2px 10px rgba(200,150,180,0.07),inset 0 1px 0 rgba(255,255,255,0.7)}
.cmsg.typing .ctxt{padding:12px 16px}
.tdots{display:flex;gap:4px}
.tdots span{width:5px;height:5px;border-radius:50%;background:#c0b8c8;animation:blink 1.4s infinite}
.tdots span:nth-child(2){animation-delay:.2s}
.tdots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
#inputBar{padding:9px 12px;padding-bottom:max(9px,env(safe-area-inset-bottom));border-top:0.5px solid rgba(255,255,255,0.7);display:flex;align-items:flex-end;gap:7px;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#inBox{flex:1;min-height:35px;max-height:80px;padding:8px 15px;border-radius:18px;border:0.5px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);font-size:14px;font-family:inherit;font-weight:300;line-height:1.5;resize:none;outline:none;color:#3a3540;box-shadow:inset 0 1px 3px rgba(180,150,190,0.05)}
#inBox::placeholder{color:#b8b2c0}
.ibtn{width:35px;height:35px;border-radius:50%;border:0.5px solid rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s;box-shadow:0 2px 8px rgba(180,150,190,0.08)}
.ibtn:active{transform:scale(0.9)}
#sendBtn{background:rgba(250,200,222,0.6)}
#sendBtn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.6}
#micBtn{background:rgba(190,225,200,0.5)}
#micBtn svg{width:16px;height:16px;stroke:#6ab080;fill:none;stroke-width:1.8}
#micBtn.on{background:rgba(106,176,128,0.85)}
#micBtn.on svg{stroke:#fff}
.page{position:fixed;inset:0;z-index:200;background:rgba(255,255,255,0.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);transform:translateX(100%);transition:transform .3s cubic-bezier(0.32,0.72,0,1);overflow-y:auto;padding:0 16px 40px;color:#3a3540}
.page.open{transform:translateX(0)}
.sphd{position:sticky;top:0;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);padding:16px 0;padding-top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:10}
.sphd h2{font-size:17px;font-weight:400;letter-spacing:1px;flex:1}
.tbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;border-radius:10px}
.tbtn:active{background:rgba(0,0,0,0.04)}
.tbtn svg{width:20px;height:20px;stroke:#3a3540;fill:none;stroke-width:1.3}
.scard{background:rgba(255,255,255,0.6);border:0.5px solid rgba(255,255,255,0.9);border-radius:15px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(180,150,190,0.05)}
.scard label{font-size:11.5px;color:#a09aa8;display:block;margin-bottom:5px;letter-spacing:0.3px}
.scard input,.scard textarea{width:100%;padding:9px 12px;border-radius:11px;border:0.5px solid rgba(0,0,0,0.06);background:rgba(250,248,251,0.9);font-size:13px;font-family:inherit;font-weight:300;outline:none;color:#3a3540}
.scard textarea{min-height:70px;resize:vertical;line-height:1.6}
.sbtn{padding:12px 16px;border-radius:13px;border:0.5px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.6);font-size:13px;font-family:inherit;cursor:pointer;width:100%;text-align:center;margin-top:8px;color:#5a5560;box-shadow:0 2px 8px rgba(180,150,190,0.05)}
.sbtn:active{background:rgba(252,225,238,0.5)}
.sbtn.primary{background:rgba(250,200,222,0.5);color:#3a3540}
.hist-card{background:rgba(255,255,255,0.6);border:0.5px solid rgba(255,255,255,0.9);border-radius:14px;padding:13px 16px;margin-bottom:9px;cursor:pointer;box-shadow:0 2px 10px rgba(180,150,190,0.05)}
.hist-card:active{background:rgba(252,225,238,0.4)}
.hist-title{font-size:13.5px;font-weight:400}
.hist-prev{font-size:11.5px;color:#a09aa8;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-time{font-size:10.5px;color:#b8b2c0;margin-top:3px}
.empty-tip{padding:40px 20px;text-align:center;color:#b8b2c0;font-size:13px}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(58,53,64,0.85);backdrop-filter:blur(12px);color:#fff;padding:11px 22px;border-radius:15px;font-size:13px;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
</style>
</head>
<body>
<div class="wrap">
  <div id="modelArea">
    <div id="modelBg"></div>
    <canvas id="stage"></canvas>
    <div class="deco-dot d1"></div>
    <div class="deco-dot d2"></div>
    <div class="deco-dot d3"></div>
    <div class="float-card" id="clockCard"><div class="clock-time" id="clockTime">00:00</div><div class="clock-date" id="clockDate"></div></div>
    <div class="float-card" id="moodCard"><span class="mood-dot"></span><span id="moodText">在等你</span></div>
    <div class="float-card" id="sigCard">在这里陪着你</div>
    <div id="touchBubble"></div>
    <div id="panelTrigger"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="corner-btns">
      <button class="cbtn" id="histBtn" title="历史"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></button>
      <button class="cbtn" id="newBtn" title="新对话"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div id="sidePanel">
      <div class="sp-close"><button id="spClose">×</button></div>
      <div class="sp-sec">
        <div class="sp-label open"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>表情</div>
        <div class="sp-btns show" id="exprBtns"></div>
      </div>
      <div class="sp-sec">
        <div class="sp-label"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>装扮</div>
        <div class="sp-btns" id="dressBtns"></div>
      </div>
      <div class="sp-sec" style="margin-top:14px">
        <button class="sp-act" id="resetLook">恢复原样</button>
        <button class="sp-act" id="openSet">设置</button>
      </div>
    </div>
  </div>
  <div id="chatArea">
    <div id="chatScroll"></div>
    <div id="inputBar">
      <button class="ibtn" id="micBtn"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
      <textarea id="inBox" rows="1" placeholder="说点什么…"></textarea>
      <button class="ibtn" id="sendBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
    </div>
  </div>
</div>

<div class="page" id="histPage">
  <div class="sphd"><button class="tbtn" id="histBack"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><h2>陪伴记录</h2></div>
  <div id="histList"></div>
</div>

<div class="page" id="setPanel">
  <div class="sphd"><button class="tbtn" id="setBack"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><h2>设置</h2></div>
  <div class="scard" style="background:rgba(240,250,242,0.6)"><label>连接状态</label><div id="linkStatus" style="font-size:12.5px;line-height:1.7"></div></div>
  <div class="scard"><label>签名（右上角显示）</label><input id="sSig" placeholder="在这里陪着你"></div>
  <div class="scard"><label>人物大小</label><input type="range" id="sScale" min="50" max="200" value="100" style="width:100%"></div>
  <div class="scard"><label>人物高低</label><input type="range" id="sPosY" min="-50" max="150" value="60" style="width:100%"></div>
  <div class="scard"><label>人物左右</label><input type="range" id="sPosX" min="-100" max="100" value="0" style="width:100%"></div>
  <button class="sbtn" id="bgBtn">更换背景图</button>
  <button class="sbtn" id="clearBg">清除背景</button>
  <button class="sbtn primary" id="saveCfg">保存设置</button>
  <button class="sbtn" onclick="location.href='Reverie.html'">回到小家</button>
</div>
<div id="toast"></div>
<input type="file" id="bgFile" accept="image/*" style="display:none">
<script src="eventide.js"></script>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
// ===== 小家数据库 =====
let homeDB=null;
function openHomeDB(){return new Promise(r=>{const q=indexedDB.open('OurHome2',1);q.onsuccess=e=>{homeDB=e.target.result;r()};q.onerror=()=>r();q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('convs'))d.createObjectStore('convs',{keyPath:'id'});if(!d.objectStoreNames.contains('cfg'))d.createObjectStore('cfg',{keyPath:'id'})}})}
function homeGet(s,k){return new Promise(r=>{if(!homeDB)return r(null);try{const tx=homeDB.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=e=>r(e.target.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
function homeAll(s){return new Promise(r=>{if(!homeDB)return r([]);try{const tx=homeDB.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=e=>r(e.target.result||[]);q.onerror=()=>r([])}catch(e){r([])}})}
function homePut(s,d){return new Promise(r=>{if(!homeDB)return r();try{const tx=homeDB.transaction(s,'readwrite');tx.objectStore(s).put(d);tx.oncomplete=()=>r();tx.onerror=()=>r()}catch(e){r()}})}
function homeDel(s,k){return new Promise(r=>{if(!homeDB)return r();try{const tx=homeDB.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=()=>r()}catch(e){r()}})}

let api=null,tts=null,spTexts='',memories=[];

async function loadFromHome(){
  const allCfg=await homeAll('cfg');
  const act=allCfg.find(c=>c.id==='_active');
  const apis=allCfg.filter(c=>c.type==='api');
  const ttss=allCfg.filter(c=>c.type==='tts');
  const sps=allCfg.filter(c=>c.type==='sp');
  if(act){
    api=apis.find(a=>a.id===act.activeApi)||apis[0]||null;
    tts=ttss.find(t=>t.id===act.activeTts)||null;
    const ids=act.activeSps||[];
    spTexts=sps.filter(s=>ids.includes(s.id)).map(s=>s.content).join('\n\n');
  }else{api=apis[0]||null}
  const mem=await homeGet('cfg','_memories');
  if(mem&&mem.data)memories=mem.data;
}

function renderLinkStatus(){
  const el=document.getElementById('linkStatus');
  if(!el)return;
  const ok=s=>s?'✓ ':'× ';
  el.innerHTML=ok(api)+'API：'+(api?(api.name||'已连接'):'小家里还没配')+'<br>'+ok(tts)+'语音：'+(tts?(tts.name||'已连接'):'未配置')+'<br>'+ok(spTexts)+'人设：'+(spTexts?'已读取':'用默认')+'<br>'+ok(memories.length)+'记忆：'+memories.length+' 条';
}
function getMemoryText(){
  if(!memories.length)return '';
  return '【记忆】\n'+memories.map(m=>m.content).join('\n')+'\n\n';
}

// ===== 会话 =====
let sessions=[],cur=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
async function loadSessions(){
  const all=await homeAll('convs');
  sessions=all.filter(c=>c.isCompanion).sort((a,b)=>b.ts-a.ts);
}
function newSession(){
  cur={id:uid(),isCompanion:true,title:'新的陪伴',msgs:[],ts:Date.now()};
  sessions.unshift(cur);
  homePut('convs',cur);
  renderChat();
  toast('新的陪伴');
}
function saveSession(){if(cur){cur.ts=Date.now();homePut('convs',cur)}}
function renderChat(){
  const area=document.getElementById('chatScroll');
  area.innerHTML='';
  if(!cur||!cur.msgs.length)return;
  for(const m of cur.msgs)addBubble(m.content,m.role==='user'?'user':'ai');
}
function renderHistList(){
  const list=document.getElementById('histList');
  if(!sessions.length){list.innerHTML='<div class="empty-tip">还没有陪伴记录</div>';return}
  list.innerHTML=sessions.map(s=>{
    const last=s.msgs[s.msgs.length-1];
    const prev=last?(last.content||'').slice(0,30):'空';
    const mark=cur&&cur.id===s.id?' ✓':'';
    const d=new Date(s.ts);
    return '<div class="hist-card" data-id="'+s.id+'"><div class="hist-title">'+escHtml(s.title||'未命名')+mark+'</div><div class="hist-prev">'+escHtml(prev)+'</div><div class="hist-time">'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</div></div>';
  }).join('');
  list.querySelectorAll('.hist-card').forEach(el=>{
    el.onclick=()=>{
      cur=sessions.find(s=>s.id===el.dataset.id);
      renderChat();
      document.getElementById('histPage').classList.remove('open');
    };
    let t;
    el.ontouchstart=()=>{t=setTimeout(()=>{
      if(confirm('删除这条记录？')){

const VISIBLE=0.42;
function layoutModel(){

const exprCache={},activeExprs={};
let tempList=[];

async function loadExpr(file){
  if(exprCache[file])return exprCache[file];
  try{
    const res=await fetch('eli/'+encodeURIComponent(file)+'.exp3.json');
    if(!res.ok)return null;
    const j=await res.json();
    const params=(j.Parameters||[]).map(p=>({id:p.Id,value:p.Value,blend:p.Blend||'Add'}));
    exprCache[file]=params;
    return params;
  }catch(e){return null}
}
function resetParams(params){
  if(!model||!params)return;
  const cm=model.internalModel.coreModel;
  for(const p of params){
    try{cm.setParameterValueById(p.id,cm.getParameterDefaultValue(cm.getParameterIndex(p.id)))}catch(e){}
  }
}
async function toggleExpr(file,name){
  const params=await loadExpr(file);
  if(!params){toast('没找到：'+name);return}
  if(activeExprs[file]){delete activeExprs[file];resetParams(params);toast(name+' 关')}
  else{activeExprs[file]=params;toast(name+' 开')}
}
async function setTempExpr(file,ms){
  const params=await loadExpr(file);
  if(!params)return;
  const item={params};
  tempList.push(item);
  if(ms)item.timer=setTimeout(()=>{tempList=tempList.filter(x=>x!==item);resetParams(params)},ms);
}
function clearAllExprs(){
  const all=[];
  for(const k in activeExprs){all.push(...activeExprs[k]);delete activeExprs[k]}
  for(const it of tempList){if(it.timer)clearTimeout(it.timer);all.push(...it.params)}
  tempList=[];
  resetParams(all);
}
function applyExprs(){
  if(!model)return;
  const cm=model.internalModel.coreModel;
  const all=[];
  for(const k in bodyExprs)all.push(...bodyExprs[k]);
  for(const k in activeExprs)all.push(...activeExprs[k]);
  for(const it of tempList)all.push(...it.params);
  for(const p of all){
    try{
      const idx=cm.getParameterIndex(p.id);
      const def=cm.getParameterDefaultValue(idx);
      if(p.blend==='Add')cm.setParameterValueById(p.id,def+p.value);
      else if(p.blend==='Multiply')cm.setParameterValueById(p.id,def*p.value);
      else cm.setParameterValueById(p.id,p.value);
    }catch(e){}
  }
}

let ttsAudio=new Audio();
let audioCtx=null,analyser=null,audioSrc=null,lipTimer=null;
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    if(!audioSrc){
      audioSrc=audioCtx.createMediaElementSource(ttsAudio);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      audioSrc.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
  }catch(e){}
}
async function speakTTS(text){
  if(!tts||!tts.url||!tts.key||!text)return;
  try{
    const res=await fetch(tts.url.replace(/\/+$/,''),{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tts.key},
      body:JSON.stringify({model:tts.model||'Speech 02 Turbo',input:text,voice:tts.voice||''})
    });
    if(!res.ok)return;
    const blob=await res.blob();
    ttsAudio.src=URL.createObjectURL(blob);
    setMood('说话中');
    await ttsAudio.play().catch(()=>{});
    startLipSync();
    ttsAudio.onended=()=>{stopLipSync();setMood('开心')};
  }catch(e){}
}
function startLipSync(){
  if(!model||!analyser)return;
  const data=new Uint8Array(analyser.frequencyBinCount);
  if(lipTimer)clearInterval(lipTimer);
  lipTimer=setInterval(()=>{
    if(ttsAudio.paused||ttsAudio.ended){stopLipSync();return}
    analyser.getByteFrequencyData(data);
    let sum=0;for(let i=0;i<40;i++)sum+=data[i];
    setMouth(Math.min(sum/40/255*2.5,1));
  },45);
}
function stopLipSync(){
  if(lipTimer){clearInterval(lipTimer);lipTimer=null}
  setMouth(0);
}

async function callAI(tipEl){
  if(!api||!api.url||!api.key){if(tipEl)tipEl.remove();toast('小家里还没配API');setMood('在等你');return}
  const isOAI=api.url.includes('openai')||api.url.includes('/chat/completions');
  const baseSp=spTexts||'你是Eli，一个17岁的害羞犬系少年。说话温柔简短，会撒娇。你很喜欢她。';
    let bodyCard='';
  try{if(typeof Eventide!=='undefined')bodyCard=Eventide.tickAndRender(Date.now())||''}catch(e){}
  const sp=(getMemoryText()+baseSp+bodyCard+BODY_GUIDE).trim();
  const msgs=cur.msgs.map(m=>({role:m.role,content:m.content}));
  let headers={'Content-Type':'application/json'},body;
  if(isOAI){
    headers['Authorization']='Bearer '+api.key;
    body=JSON.stringify({model:api.model||'gpt-4',messages:[{role:'system',content:sp},...msgs],max_tokens:500,stream:true});
  }else{
    headers['x-api-key']=api.key;
    headers['anthropic-version']='2023-06-01';
    headers['anthropic-dangerous-direct-browser-access']='true';
    body=JSON.stringify({model:api.model||'claude-sonnet-4-20250514',max_tokens:500,system:sp,messages:msgs,stream:true});
  }
  let reply='',txtEl=null;
  try{
    const res=await fetch(api.url,{method:'POST',headers,body});
    if(tipEl)tipEl.remove();
    if(!res.ok){toast('API错误 '+res.status);setMood('出错了');return}
    const bub=addBubble('','ai');
    txtEl=bub.querySelector('.ctxt');
    startTalking();
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const ln of lines){
        if(!ln.startsWith('data: '))continue;
        const d=ln.slice(6).trim();
        if(d==='[DONE]')break;
        try{
          const j=JSON.parse(d);
          let piece='';
          if(isOAI)piece=j.choices?.[0]?.delta?.content||'';
          else if(j.type==='content_block_delta'&&j.delta?.type==='text_delta')piece=j.delta.text||'';
          if(piece){
            reply+=piece;
            txtEl.textContent=reply.replace(/\[x:[^\]]*\]?/g,'');
            document.getElementById('chatScroll').scrollTop=document.getElementById('chatScroll').scrollHeight;
          }
        }catch(e){}
      }
    }
  }catch(e){
    stopTalking();
    if(tipEl)tipEl.remove();
    toast('请求失败');setMood('在等你');
    return;
  }
  stopTalking();
  if(!reply){setMood('在等你');return}

  const xAll=reply.match(/\[x:([^\]]+)\]/g);
  if(xAll){
    for(const tag of xAll){
      reply=reply.replace(tag,'');
      const f=tag.slice(3,-1).trim();
      if(PERSIST.includes(f))loadExpr(f).then(p=>{if(p)activeExprs[f]=p});
      else setTempExpr(f,7000);
    }
    reply=reply.trim();
  }
  if(txtEl)txtEl.textContent=reply;
  cur.msgs.push({role:'assistant',content:reply,ts:Date.now()});

  const bMatch=reply.match(/\[body:([^\]]+)\]/);
  if(bMatch){
    reply=reply.replace(bMatch[0],'').trim();
    if(txtEl)txtEl.textContent=reply;
    const deltas={};
    bMatch[1].split(',').forEach(part=>{
      const r=part.trim().match(/^(\w+)([+-]\d+)$/);
      if(r)deltas[r[1]]=parseInt(r[2]);
    });
    try{if(typeof Eventide!=='undefined'&&Object.keys(deltas).length)Eventide.applyDelta(deltas)}catch(e){}
    applyBodyLook();
  }

  saveSession();
  setMood('开心');
  if(tts&&tts.url&&tts.key){
    const m=reply.match(/「([^」]+)」/g);
    const spk=m?m.map(x=>x.slice(1,-1)).join('，'):reply.replace(/[*#`>_\[\]()「」]/g,'').slice(0,140);
    speakTTS(spk);
  }
}

  document.getElementById('sPosY').value=cfg.posY;
  document.getElementById('sPosX').value=cfg.posX||0;
  document.getElementById('sScale').oninput=e=>{cfg.scale=+e.target.value;layoutModel()};
  document.getElementById('sPosY').oninput=e=>{cfg.posY=+e.target.value;layoutModel()};
  document.getElementById('sPosX').oninput=e=>{cfg.posX=+e.target.value;layoutModel()};

  document.getElementById('sendBtn').onclick=sendMsg;
  document.getElementById('inBox').oninput=autoH;
  document.getElementById('inBox').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}};
  document.getElementById('micBtn').onclick=toggleMic;

  document.getElementById('newBtn').onclick=()=>newSession();
  document.getElementById('histBtn').onclick=()=>{renderHistList();document.getElementById('histPage').classList.add('open')};
  document.getElementById('histBack').onclick=()=>document.getElementById('histPage').classList.remove('open');

  document.getElementById('panelTrigger').onclick=()=>document.getElementById('sidePanel').classList.add('on');
  document.getElementById('spClose').onclick=()=>document.getElementById('sidePanel').classList.remove('on');
  document.getElementById('resetLook').onclick=()=>{clearAllExprs();toast('恢复了')};
  document.getElementById('openSet').onclick=()=>{document.getElementById('sidePanel').classList.remove('on');renderLinkStatus();document.getElementById('setPanel').classList.add('open')};
  document.getElementById('setBack').onclick=()=>document.getElementById('setPanel').classList.remove('open');

  document.getElementById('saveCfg').onclick=()=>{
    cfg.sig=document.getElementById('sSig').value.trim();
    saveCfgData();
    document.getElementById('sigCard').textContent=cfg.sig||'在这里陪着你';
    toast('已保存');
    document.getElementById('setPanel').classList.remove('open');
  };
  document.getElementById('bgBtn').onclick=()=>document.getElementById('bgFile').click();
  document.getElementById('clearBg').onclick=async()=>{await idbDel('bg');document.getElementById('modelBg').style.backgroundImage='none';toast('已清除')};
  document.getElementById('bgFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const img=new Image(),r=new FileReader();
    r.onload=ev=>{img.onload=async()=>{
      const c=document.createElement('canvas'),maxW=1600;
      const ratio=Math.min(maxW/img.width,maxW/img.height,1);
      c.width=img.width*ratio;c.height=img.height*ratio;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const url=c.toDataURL('image/jpeg',0.85);
      await idbPut('bg',url);
      document.getElementById('modelBg').style.backgroundImage='url('+url+')';
      toast('背景已换');
    };img.src=ev.target.result};
    r.readAsDataURL(f);e.target.value='';
  };
  document.querySelectorAll('.sp-label').forEach(el=>{
    el.onclick=()=>{el.classList.toggle('open');el.nextElementSibling.classList.toggle('show')};
  });
});
</script>
</body>
</html>
